[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "straddloop"
version = "0.1.0"
description = "Personal quantitative research platform for Indian index and stock options"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "httpx>=0.27",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
straddloop = "straddloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
straddloop = ["app/templates/*.html", "app/static/*", "reference/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
